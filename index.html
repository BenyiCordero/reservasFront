<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrupoVO — Reserva de Salas</title>
  <link rel="icon" type="image/png" href="assets/icono.png">
  <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
</head>
<body>

  <div id="app-view">
    <header id="topbar">
      <div class="topbar-left">
        <button class="btn btn-link topbar-toggle d-lg-none" id="sidebarToggle" type="button">
          <i class="fas fa-bars"></i>
        </button>
        <span class="topbar-brand">Reserva de Salas</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-topbar-icon" id="btn-reload" title="Recargar módulo actual">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </header>

    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand-text">
          <div class="sidebar-title">Reserva de Salas</div>
          <small class="sidebar-sub">GrupoVO</small>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <div class="sidebar-section-label">Módulos</div>
        <a href="#" class="sidebar-item active" data-view="pages/reservas.html" data-module="reservas">
          <i class="fas fa-calendar-alt sidebar-item-icon"></i>
          <span>Calendario</span>
        </a>
        <a href="#" class="sidebar-item" data-view="pages/vista-usuario.html" data-module="vista-usuario">
          <i class="fas fa-eye sidebar-item-icon"></i>
          <span>Vista de Usuario</span>
        </a>
        <div class="sidebar-section-label mt-3">Admin</div>
        <a href="#" class="sidebar-item" data-view="pages/salas.html" data-module="salas">
          <i class="fas fa-door-open sidebar-item-icon"></i>
          <span>Salas</span>
        </a>
        <a href="#" class="sidebar-item" data-view="pages/areas.html" data-module="areas">
          <i class="fas fa-building sidebar-item-icon"></i>
          <span>Áreas</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <small class="text-muted">v1.0.0</small>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main id="main-content">
      <div class="welcome-container">
        <div class="welcome-card text-center">
          <h2 class="welcome-title">Reserva de Salas</h2>
          <p class="welcome-text text-muted">Selecciona un módulo en el menú lateral para comenzar</p>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-body text-center p-4">
          <div class="confirm-icon mb-3">
            <i class="fas fa-exclamation-triangle fa-3x text-warning"></i>
          </div>
          <h5 class="fw-semibold mb-2" id="confirmTitle">¿Estás seguro?</h5>
          <p class="text-muted mb-0 small" id="confirmMsg">Esta acción no se puede deshacer.</p>
        </div>
        <div class="modal-footer border-0 justify-content-center pb-4 pt-0">
          <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger px-4" id="confirmBtn">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/fontawesome/js/all.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
