<div class="container-fluid px-0">
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-2">
    <div>
      <h4 class="fw-bold mb-1">Áreas</h4>
      <p class="text-muted small mb-0">Gestión de áreas o departamentos</p>
    </div>
    <button class="btn btn-primary" id="btnNuevaArea">
      <i class="fas fa-plus me-1"></i> Nueva
    </button>
  </div>

  <div class="panel-card p-3 mb-4">
    <div class="row g-2 align-items-center">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
          <input type="text" class="form-control border-start-0" id="buscarArea" placeholder="Buscar por nombre...">
        </div>
      </div>
    </div>
  </div>

  <div class="panel-card p-3">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th style="width:60px">#</th>
            <th>Nombre</th>
            <th style="width:100px">Estado</th>
            <th style="width:130px" class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="loading-row">
            <td colspan="4" class="text-center py-4">
              <div class="spinner-table"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center mt-3 gap-2">
      <span class="table-info-text" id="tableInfo">Cargando...</span>
    </div>

    <div id="emptyState" class="text-center py-5 d-none">
      <i class="fas fa-building empty-state-icon"></i>
      <p class="text-muted mt-2">No se encontraron áreas</p>
    </div>
  </div>
</div>

<div class="modal fade" id="areaModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="areaModalTitle">Nueva Área</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formArea" novalidate>
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="form-label">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="areaNombre" required maxlength="100" placeholder="Nombre del área">
          </div>
          <div class="mb-3">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="areaActiva" checked>
              <label class="form-check-label" for="areaActiva">Activa</label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardarArea">
          <i class="fas fa-check me-1"></i> Guardar
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  #tableBody .btn-action { margin: 0 1px; }
</style>
