<div class="container-fluid px-0">
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-2">
    <div>
      <h4 class="fw-bold mb-1">Usuarios</h4>
      <p class="text-muted small mb-0">Gesti&oacute;n de usuarios del sistema</p>
    </div>
    <button class="btn btn-primary" id="btnNuevoUsuario">
      <i class="fas fa-plus me-1"></i> Nuevo Usuario
    </button>
  </div>

  <div class="panel-card p-3">
    <div class="table-responsive">
      <table class="table table-custom mb-0" id="tablaUsuarios">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Fecha Registro</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="5" class="text-center text-muted py-4">Cargando...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="usuarioModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="modalUsuarioTitle">Nuevo Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formUsuario" novalidate>
          <div class="mb-3">
            <label class="form-label">Usuario <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="usuarioUsuario" required placeholder="Nombre de usuario" autocomplete="off">
          </div>
          <div id="usuarioPasswordGroup" class="mb-3">
            <label class="form-label">Contrase&ntilde;a <span class="text-danger" id="pwRequired">*</span></label>
            <input type="password" class="form-control" id="usuarioPassword" placeholder="Contrase&ntilde;a" autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label">Rol <span class="text-danger">*</span></label>
            <select class="form-select" id="usuarioRol" required>
              <option value="ADMINISTRADOR">ADMINISTRADOR</option>
              <option value="VISTA">VISTA</option>
            </select>
          </div>
          <div class="mb-0 form-check form-switch">
            <input class="form-check-input" type="checkbox" id="usuarioActiva" checked>
            <label class="form-check-label" for="usuarioActiva">Activo</label>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardarUsuario">
          <i class="fas fa-save me-1"></i> Guardar
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  #tablaUsuarios .acciones-cell { white-space: nowrap; text-align: right; }
  #tablaUsuarios tbody td { vertical-align: middle; }
</style>
